services:
  postgres:
    image: postgres:16-alpine
    container_name: flow_postgres
    environment:
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: flow_password
      POSTGRES_DB: flow_process
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_user -d flow_process"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow_network

  redis:
    image: redis:7-alpine
    container_name: flow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow_network

  backend:
    build: ../backend
    container_name: flow_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://flow_user:flow_password@postgres:5432/flow_process
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://172.20.0.2:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flow_network
    develop:
      watch:
        - action: sync
          path: ../backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/
        - action: rebuild
          path: ../backend/pyproject.toml

  frontend:
    build: ../frontend
    container_name: flow_frontend
    ports:
      - "5173:5173"
    networks:
      - flow_network
    develop:
      watch:
        - action: sync
          path: ../frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ../frontend/package.json

volumes:
  postgres_data:
  redis_data:

networks:
  flow_network:
    driver: bridge